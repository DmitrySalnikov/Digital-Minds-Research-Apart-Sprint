[project]
name = "selfprobe"
version = "0.1.0"
description = "Persona-invariance of self-preservation hierarchies in language models"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "tqdm>=4.66",
]

[project.optional-dependencies]
modal = ["modal>=0.64"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["selfprobe"]
